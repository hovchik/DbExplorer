name: Windows installer

# Builds DbExplorer-Setup-<version>.exe on Windows. Tag a release (v1.2.0) to get that version number;
# other runs are numbered 1.0.<run>. Download the installer from the run's artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'installer/**'
      - 'src/**'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { "1.0.$env:RUN_NUMBER" }
          ./installer/build-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: DbExplorer-Setup
          path: installer/out/DbExplorer-Setup-*.exe
          if-no-files-found: error
