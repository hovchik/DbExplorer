name: Windows installer

# Builds DbExplorer-Setup-<version>.exe on Windows. Tag a release (v1.2.0, or v1.2.0-rc1 for a pre-release) to get
# that version number and a draft GitHub release with the installer attached; other runs are numbered 0.0.<run>, so
# a test build never looks newer than a real release. Download those from the run's artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'installer/**'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { "0.0.$env:RUN_NUMBER" }
          ./installer/build-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: DbExplorer-Setup
          path: installer/out/DbExplorer-Setup-*.exe
          if-no-files-found: error

  release:
    # A tag push gets a draft release with the installer attached; publish it from the Releases page.
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DbExplorer-Setup
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" DbExplorer-Setup-*.exe --repo "$GITHUB_REPOSITORY" --draft --generate-notes $prerelease --title "DB Explorer ${TAG#v}"
