name: Tests

# Builds the solution and runs the unit tests on every pull request and push to master. The integration tests
# against real servers skip here (they need DBEXPLORER_TEST_* variables; see the README).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=minimal"
